name: SyncScribe VM Control

# AUTOMATED CERTIFICATE RENEWAL:
# This workflow automatically renews SSL certificates monthly via scheduled cron job.
# The renewal script only renews if certificate expires within 30 days, ensuring
# certificates are renewed well before the 90-day Let's Encrypt expiry.
# Schedule: Runs on the 1st of each month at 2 AM UTC

# SETUP INSTRUCTIONS:
# 1. Add GitHub Repository Variables (Settings > Secrets and variables > Actions > Variables):
#    - VM_NAME: syncscribe-vm (optional, has default)
#    - VM_ZONE: us-central1-a (optional, has default)
#    - APP_DOMAIN: voiceido.com (optional, has default)
#    - APP_WWW_DOMAIN: www.voiceido.com (optional, has default)
#    - LEGACY_DOMAIN: syncscribe.app (optional, has default)
#    - CERTBOT_EMAIL: admin@voiceido.com (optional, has default)
#    - REACT_APP_SERVER_URL: https://voiceido.com (optional, has default)
#    - GCS_BUCKET_N1: syncscribe-n1 (REQUIRED - update from old GCS_NG_BUCKET)
#    - GCS_BUCKET_U1: syncscribe-u1 (REQUIRED - update from old GCS_UKG_BUCKET)
#
# 2. Add GitHub Repository Secrets (Settings > Secrets and variables > Actions > Secrets):
#    - OPENAI_API_KEY: Your OpenAI API key
#    - DEEPGRAM_API_KEY: Your Deepgram API key
#    - ASSEMBLYAI_API_KEY: Your AssemblyAI API key
#    - OPENROUTER_API_KEY: Your OpenRouter API key
#    - SPEECHMATICS_API_KEY: Your Speechmatics API key
#    - SPEECHMATICS_MY_SPEAKER_IDS: Your enrolled "Me" speaker identifier(s), comma-separated
#    - GCS_CLIENT_EMAIL: GCS service account email
#    - GCS_PRIVATE_KEY: GCS service account private key
#    - GCP_WIF_PROVIDER: Workload Identity Federation provider
#    - GCP_WIF_SERVICE_ACCOUNT: Service account email for WIF
#    - REACT_APP_RAG_PASSWORD: Optional RAG password (leave empty for production)
#
# 3. Grant service account permissions (GCP_WIF_SERVICE_ACCOUNT secret):
#    gcloud projects add-iam-policy-binding meeting-trans-443019 \
#      --member="serviceAccount:SERVICE_ACCOUNT_EMAIL" \
#      --role="roles/compute.instanceAdmin.v1"
#
# 4. Required permissions:
#    - compute.instances.get
#    - compute.instances.start
#    - compute.instances.stop
#    - compute.instances.use (for SSH)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "VM deployment action"
        required: true
        type: choice
        options:
          - deploy-offline
          - deploy-online
          - renew-certificate
        default: deploy-online
  schedule:
    # Weekdays at 7:50 AM EST (12:50 UTC during EST, 11:50 UTC during EDT)
    # 7:50 AM EST = 12:50 UTC (during EST) or 11:50 UTC (during EDT)
    # Using 12:50 UTC (will be 7:50 AM EST or 8:50 AM EDT)
    - cron: '50 12 * * 1-5'  # Monday-Friday at 12:50 UTC (7:50 AM EST / 8:50 AM EDT) - deploy-online
    
    # Weekdays at 5:30 PM EST (22:30 UTC during EST, 21:30 UTC during EDT)
    # 5:30 PM EST = 22:30 UTC (during EST) or 21:30 UTC (during EDT)
    # Using 22:30 UTC (will be 5:30 PM EST or 6:30 PM EDT)
    - cron: '30 22 * * 1-5'  # Monday-Friday at 22:30 UTC (5:30 PM EST / 6:30 PM EDT) - deploy-offline
    
    # Run certificate renewal check monthly on the 1st at 2 AM UTC
    # The renewal script will only renew if certificate expires within 30 days
    # This ensures renewal happens well before the 90-day Let's Encrypt expiry
    - cron: '0 2 1 * *'  # Monthly certificate renewal

permissions:
  contents: read
  id-token: write

env:
  # Set via GitHub Repository Variables
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  VM_NAME: ${{ vars.VM_NAME || 'syncscribe-vm' }}
  VM_ZONE: ${{ vars.VM_ZONE || 'us-central1-a' }}
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
  # VM's service account (default compute service account)
  VM_SERVICE_ACCOUNT: "840029787447-compute@developer.gserviceaccount.com"

jobs:
  vm-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Authenticate to Google Cloud via Workload Identity Federation
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify VM access and permissions
        run: |
          echo "Verifying VM access and permissions..."
          if gcloud compute instances describe "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --format="get(status,networkInterfaces[0].accessConfigs[0].natIP)" 2>&1; then
            echo "[OK] VM access verified"
          else
            echo "[X] Error: Service account lacks required permissions"
            echo ""
            echo "Required permissions:"
            echo "  - compute.instances.get"
            echo "  - compute.instances.start"
            echo "  - compute.instances.stop"
            echo "  - compute.instances.use (for SSH)"
            echo ""
            echo "Grant these permissions to the service account:"
            echo "  ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}"
            echo ""
            echo "Or assign the 'Compute Instance Admin' role:"
            echo "  gcloud projects add-iam-policy-binding $GCP_PROJECT_ID \\"
            echo "    --member='serviceAccount:${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}' \\"
            echo "    --role='roles/compute.instanceAdmin.v1'"
            exit 1
          fi

      - name: Determine deployment action
        id: decide
        run: |
          # If manually triggered, use the input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "Manual trigger: ${{ inputs.action }}"
            exit 0
          fi

          # Scheduled trigger logic (use the cron expression that triggered this run)
          # github.event.schedule contains the exact cron string that fired
          SCHEDULE="${{ github.event.schedule }}"
          echo "Triggered by schedule: '$SCHEDULE'"

          case "$SCHEDULE" in
            "50 12 * * 1-5")
              echo "action=deploy-online" >> "$GITHUB_OUTPUT"
              echo "Scheduled: deploy-online (weekday morning - start of workday)"
              ;;
            "30 22 * * 1-5")
              echo "action=deploy-offline" >> "$GITHUB_OUTPUT"
              echo "Scheduled: deploy-offline (weekday evening - end of workday)"
              ;;
            "0 2 1 * *")
              echo "action=renew-certificate" >> "$GITHUB_OUTPUT"
              echo "Scheduled: renew-certificate (monthly, 1st at 2 AM UTC)"
              ;;
            *)
              echo "action=deploy-offline" >> "$GITHUB_OUTPUT"
              echo "Scheduled: deploy-offline (default/fallback - unknown schedule)"
              ;;
          esac

      - name: Make scripts executable
        run: |
          chmod +x scripts/deploy-offline.sh
          chmod +x scripts/deploy-online.sh

      - name: Run deploy-offline
        if: steps.decide.outputs.action == 'deploy-offline'
        env:
          VM_NAME: ${{ env.VM_NAME }}
          ZONE: ${{ env.VM_ZONE }}
          STOP_VM: "true"
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: |
          echo "Running deploy-offline.sh..."
          export VM_NAME="$VM_NAME"
          export ZONE="$ZONE"
          export STOP_VM="$STOP_VM"
          export GCP_PROJECT_ID="$GCP_PROJECT_ID"
          # Impersonate VM's service account for SSH access
          export CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT="${{ env.VM_SERVICE_ACCOUNT }}"
          ./scripts/deploy-offline.sh

      - name: Run deploy-online
        if: steps.decide.outputs.action == 'deploy-online'
        env:
          VM_NAME: ${{ env.VM_NAME }}
          ZONE: ${{ env.VM_ZONE }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          # Use the branch that triggered this workflow (from "Use workflow from" dropdown)
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REF: ${{ github.ref }}  # This will be the selected branch (e.g., refs/heads/your-branch)
          DEPLOY_CODE: "true"
          # API Keys from GitHub Secrets (will be injected into .env file on VM)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          SPEECHMATICS_MY_SPEAKER_IDS: ${{ secrets.SPEECHMATICS_MY_SPEAKER_IDS }}
          SPEECHMATICS_REGION: ${{ vars.SPEECHMATICS_REGION || 'us' }}
          SPEECHMATICS_RT_URL: ${{ vars.SPEECHMATICS_RT_URL || 'wss://us.rt.speechmatics.com/v2' }}
          SPEECHMATICS_LANGUAGE: ${{ vars.SPEECHMATICS_LANGUAGE || 'en' }}
          SPEECHMATICS_MODEL: ${{ vars.SPEECHMATICS_MODEL || 'enhanced' }}
          SPEECHMATICS_MY_SPEAKER_LABEL: ${{ vars.SPEECHMATICS_MY_SPEAKER_LABEL || 'Me' }}
          # GCS Credentials from Secrets
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          # GCS Configuration (set in GitHub Repository Variables)
          # NOTE: Update GitHub Variables to use GCS_BUCKET_N1 and GCS_BUCKET_U1 (not GCS_NG_BUCKET/GCS_UKG_BUCKET)
          GCS_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET_N1: ${{ vars.GCS_BUCKET_N1 }}
          GCS_BUCKET_U1: ${{ vars.GCS_BUCKET_U1 }}
          GCS_BUCKET_U2: ${{ vars.GCS_BUCKET_U2 }}
          GCS_PROMPTS_BUCKET: ${{ vars.GCS_PROMPTS_BUCKET }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'voiceido.com' }}
          APP_WWW_DOMAIN: ${{ vars.APP_WWW_DOMAIN || 'www.voiceido.com' }}
          LEGACY_DOMAIN: ${{ vars.LEGACY_DOMAIN || 'syncscribe.app' }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || 'admin@voiceido.com' }}
          REACT_APP_SERVER_URL: ${{ vars.REACT_APP_SERVER_URL || 'https://voiceido.com' }}
          # Optional: Set RAG password for specific environments via secrets
          REACT_APP_RAG_PASSWORD: ${{ secrets.REACT_APP_RAG_PASSWORD }}
        run: |
          echo "Running deploy-online.sh..."
          echo "Deploying from branch: ${{ github.ref }}"
          export VM_NAME="$VM_NAME"
          export ZONE="$ZONE"
          export GCP_PROJECT_ID="$GCP_PROJECT_ID"
          export GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          export GITHUB_WORKSPACE="$GITHUB_WORKSPACE"
          export GITHUB_REF="$GITHUB_REF"
          export DEPLOY_CODE="$DEPLOY_CODE"
          # Export API keys for .env file creation
          export OPENAI_API_KEY="$OPENAI_API_KEY"
          export DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY"
          export ASSEMBLYAI_API_KEY="$ASSEMBLYAI_API_KEY"
          export OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          export SPEECHMATICS_API_KEY="$SPEECHMATICS_API_KEY"
          export SPEECHMATICS_MY_SPEAKER_IDS="$SPEECHMATICS_MY_SPEAKER_IDS"
          export SPEECHMATICS_REGION="$SPEECHMATICS_REGION"
          export SPEECHMATICS_RT_URL="$SPEECHMATICS_RT_URL"
          export SPEECHMATICS_LANGUAGE="$SPEECHMATICS_LANGUAGE"
          export SPEECHMATICS_MODEL="$SPEECHMATICS_MODEL"
          export SPEECHMATICS_MY_SPEAKER_LABEL="$SPEECHMATICS_MY_SPEAKER_LABEL"
          export GCS_CLIENT_EMAIL="$GCS_CLIENT_EMAIL"
          export GCS_PRIVATE_KEY="$GCS_PRIVATE_KEY"
          export GCS_PROJECT_ID="$GCS_PROJECT_ID"
          export GCS_BUCKET_N1="$GCS_BUCKET_N1"
          export GCS_BUCKET_U1="$GCS_BUCKET_U1"
          export GCS_BUCKET_U2="$GCS_BUCKET_U2"
          export GCS_PROMPTS_BUCKET="$GCS_PROMPTS_BUCKET"
          export APP_DOMAIN="$APP_DOMAIN"
          export APP_WWW_DOMAIN="$APP_WWW_DOMAIN"
          export LEGACY_DOMAIN="$LEGACY_DOMAIN"
          export CERTBOT_EMAIL="$CERTBOT_EMAIL"
          export REACT_APP_SERVER_URL="$REACT_APP_SERVER_URL"
          export REACT_APP_RAG_PASSWORD="$REACT_APP_RAG_PASSWORD"
          # Impersonate VM's service account for SSH access
          export CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT="${{ env.VM_SERVICE_ACCOUNT }}"
          ./scripts/deploy-online.sh

      - name: Renew SSL Certificate
        if: steps.decide.outputs.action == 'renew-certificate'
        env:
          VM_NAME: ${{ env.VM_NAME }}
          ZONE: ${{ env.VM_ZONE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          APP_DOMAIN="${{ vars.APP_DOMAIN || 'voiceido.com' }}"
          echo "Renewing SSL certificate for $APP_DOMAIN..."
          export VM_NAME="$VM_NAME"
          export ZONE="$ZONE"
          export GCP_PROJECT_ID="$GCP_PROJECT_ID"
          # Impersonate VM's service account for SSH access
          export CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT="${{ env.VM_SERVICE_ACCOUNT }}"
          
          # Make script executable
          chmod +x scripts/renew-certificate.sh
          
          # Run certificate renewal
          SSH_OPTS="--zone=$ZONE --quiet"
          if [ -n "$CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT" ]; then
            SSH_OPTS="$SSH_OPTS --impersonate-service-account=$CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT"
          fi
          
          # Upload and run renewal script on VM
          gcloud compute scp scripts/renew-certificate.sh "$VM_NAME":~/renew-cert.sh \
            --zone="$ZONE" \
            --project="$GCP_PROJECT_ID" $SSH_OPTS 2>&1 || {
            echo "[X] Failed to upload renewal script"
            exit 1
          }
          
          gcloud compute ssh "$VM_NAME" $SSH_OPTS \
            --project="$GCP_PROJECT_ID" \
            --command="chmod +x ~/renew-cert.sh && ~/renew-cert.sh $APP_DOMAIN" || {
            echo "[X] Certificate renewal failed"
            exit 1
          }
          
          echo ""
          echo "======================================"
          echo "  Certificate Renewal Complete!"
          echo "======================================"

      - name: Show VM status
        if: always()
        run: |
          echo "=== VM Status ==="
          gcloud compute instances describe "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --format="table(
              name,
              status,
              networkInterfaces[0].accessConfigs[0].natIP:label=EXTERNAL_IP,
              machineType.scope(machineTypes):label=MACHINE_TYPE
            )" || echo "VM not accessible"

      - name: Show container status
        if: always() && (steps.decide.outputs.action == 'deploy-online' || steps.decide.outputs.action == 'renew-certificate')
        env:
          CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT: ${{ env.VM_SERVICE_ACCOUNT }}
        run: |
          echo "=== Container Status ==="
          SSH_OPTS="--zone=$VM_ZONE --quiet"
          if [ -n "$CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT" ]; then
            SSH_OPTS="$SSH_OPTS --impersonate-service-account=$CLOUDSDK_AUTH_IMPERSONATE_SERVICE_ACCOUNT"
          fi
          if gcloud compute ssh "$VM_NAME" $SSH_OPTS \
            --project="$GCP_PROJECT_ID" \
            --command="cd ~/meeting-transcriber && sudo docker-compose ps 2>&1" 2>&1; then
            echo "[OK] Container status retrieved"
          else
            echo "[X] Could not check container status"
            echo "  This may be due to:"
            echo "  - VM is still starting up"
            echo "  - SSH connection issues"
            echo "  - Missing iam.serviceAccountUser permission"
          fi

      - name: Show DNS status
        if: always() && (steps.decide.outputs.action == 'deploy-online' || steps.decide.outputs.action == 'renew-certificate')
        run: |
          echo "=== DNS Status ==="
          VM_IP=$(gcloud compute instances describe "$VM_NAME" \
            --zone="$VM_ZONE" \
            --project="$GCP_PROJECT_ID" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)' 2>/dev/null || echo "")
          
          if [ -n "$VM_IP" ]; then
            echo "VM IP: $VM_IP"
            APP_DOMAIN="${{ vars.APP_DOMAIN || 'voiceido.com' }}"
            DNS_IP=$(dig +short "$APP_DOMAIN" 2>/dev/null | head -1 || echo "")
            if [ -n "$DNS_IP" ]; then
              if [ "$VM_IP" = "$DNS_IP" ]; then
                echo "DNS: $APP_DOMAIN -> $DNS_IP (matches VM IP)"
              else
                echo "DNS: $APP_DOMAIN -> $DNS_IP (mismatch - update DNS to $VM_IP)"
              fi
            else
              echo "DNS: Could not resolve $APP_DOMAIN"
            fi
          else
            echo "Could not determine VM IP"
          fi
